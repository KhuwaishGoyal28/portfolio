<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Khuwaish Goyal</title>
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--card:#11141d;--ink:#ece9e1;--mute:#8b90a0;--line:rgba(236,233,225,.1);--accent:#ffb454;
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{background:radial-gradient(ellipse at 20% 0%,var(--bg2),transparent 60%),radial-gradient(ellipse at 90% 100%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 55%),var(--bg);background-attachment:fixed;transition:background .6s;color:var(--ink);font:400 16px/1.6 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.mono{font:500 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
#warp{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}.pitch,.head p{text-shadow:0 0 18px var(--bg),0 0 6px var(--bg)}
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);background:linear-gradient(var(--bg),transparent)}
.back{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:.9rem;background:var(--card);backdrop-filter:blur(8px)}
.back:hover{border-color:var(--accent);color:var(--accent)}
.nav-p{display:flex;gap:8px}.nav-p a{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--card)}
.nav-p a:hover{border-color:var(--accent);color:var(--accent)}

/* intro: curtains + title */
.intro{position:fixed;inset:0;z-index:30;pointer-events:none;display:grid;place-items:center}
.curtain{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,var(--cur1) 0 26px,var(--cur2) 26px 52px);box-shadow:inset 0 -80px 120px #000;transition:transform 1.6s cubic-bezier(.7,0,.2,1) .9s}
.curtain.l{left:0}.curtain.r{right:0}
.intro h1{position:relative;font:italic 600 clamp(2.6rem,9vw,7rem)/1 var(--serif);color:var(--accent);text-shadow:0 0 50px var(--accent);transition:opacity .6s .8s,transform 1.4s .4s}
.intro.open .l{transform:translateX(-102%)}.intro.open .r{transform:translateX(102%)}
.intro.open h1{opacity:0;transform:scale(1.4)}

main{position:relative;z-index:5;padding:96px clamp(16px,4vw,48px) 80px;max-width:1400px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}
.kind{color:var(--accent)}
h2.t{font:600 clamp(2.4rem,6vw,4.6rem)/1 var(--serif);letter-spacing:-.02em;margin:6px 0 10px}
.award{display:inline-block;padding:6px 14px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:.9rem;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pitch{color:var(--mute);font-size:1.1rem;max-width:620px;margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:.92rem;background:var(--card);cursor:pointer;color:var(--ink);font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}.btn.p:hover{color:var(--onaccent);filter:brightness(1.08)}

/* theatre screen */
.theatre{perspective:1600px;margin:10px 0 60px}
.screen{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9;max-height:78vh;width:100%;
  box-shadow:0 0 0 1px var(--line),0 0 120px -20px var(--accent),0 60px 120px -40px #000;transform:rotateX(18deg) scale(.9);transition:transform 1.4s cubic-bezier(.2,.8,.2,1) 1.2s}
.ready .screen{transform:none;opacity:1}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0c12}
.chrome{position:absolute;inset:0 0 auto;height:34px;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:2}
.chrome i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
.chrome span{margin-left:10px;color:var(--mute);font:.72rem var(--mono);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chrome .rec{margin-left:auto;color:#ff5a5a;animation:bl 1.4s steps(2) infinite}@keyframes bl{50%{opacity:.2}}
.screen .frame{position:absolute;inset:34px 0 0}
.nodemo{position:absolute;inset:34px 0 0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--accent) 25%,#07080d),#07080d)}
.nodemo h3{font:italic 600 clamp(1.6rem,4vw,3rem) var(--serif);margin-bottom:10px}
.nodemo p{color:var(--mute);max-width:460px;margin:0 auto 18px}
.glow-floor{height:60px;margin-top:-10px;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--accent) 40%,transparent),transparent 70%);filter:blur(12px)}

/* story steps */
.sec-t{font:600 clamp(1.8rem,4vw,2.8rem)/1.1 var(--serif);margin:10px 0 26px}.sec-t em{color:var(--accent)}
.steps{position:relative;display:grid;gap:18px;margin-bottom:70px}
.steps::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--accent),transparent)}
.step{position:relative;padding:20px 22px 20px 70px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 10px 30px -18px rgba(0,0,0,.35);backdrop-filter:blur(8px);opacity:0;transform:translateX(-30px);transition:.8s cubic-bezier(.2,.8,.2,1)}
.step.in{opacity:1;transform:none}
.step b.n{position:absolute;left:6px;top:18px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--card);border:2px solid var(--accent);color:var(--accent);font:600 .85rem var(--mono)}
.step h4{font:600 1.2rem var(--serif);margin-bottom:4px}.step p{color:var(--mute)}

/* stack */
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sk{display:flex;gap:16px;align-items:flex-start;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 10px 30px -18px rgba(0,0,0,.35);opacity:0;transform:translateY(24px) rotateX(-20deg);transition:.8s cubic-bezier(.2,.8,.2,1)}
.sk.in{opacity:1;transform:none}
.sk-ico{width:46px;height:46px;flex:none;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,255,255,.12))}
.glyph{display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,#0a0c12);color:var(--c);font:700 1.1rem var(--mono);border:1px solid var(--c)}
.sk h5{font:700 1rem var(--sans);margin-bottom:4px}.sk p{color:var(--mute);font-size:.9rem}
.more{margin-top:70px}
.others{display:flex;gap:10px;flex-wrap:wrap}
.others a{padding:9px 16px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:.9rem;background:var(--card)}
.others a:hover{border-color:var(--accent);color:var(--accent)}
footer{position:relative;z-index:5;text-align:center;color:var(--mute);padding:30px 16px;border-top:1px solid var(--line)}

.kind{display:inline-flex;align-items:center;gap:8px}.kind::before{content:"";width:22px;height:2px;background:var(--accent)}
h2.t{background:linear-gradient(100deg,var(--ink) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.theme-chip{display:inline-flex;gap:6px;align-items:center;margin-left:10px;vertical-align:middle}
.theme-chip i{width:12px;height:12px;border-radius:50%;background:var(--accent)}.theme-chip i+i{background:var(--accent2)}
.screen{border:1px solid var(--line)}
.light .intro h1{text-shadow:0 0 40px color-mix(in srgb,var(--accent) 60%,transparent)}
.light .step,.light .sk{box-shadow:0 12px 30px -20px rgba(30,20,0,.25)}
footer{background:color-mix(in srgb,var(--bg) 70%,transparent)}
@media (max-width:720px){.screen{aspect-ratio:9/16;max-height:80vh}.steps::before{left:19px}}
@media (prefers-reduced-motion:reduce){.curtain,.intro h1,.screen,.step,.sk{transition:none!important}}
</style>
</head>
<body>
<canvas id="warp" aria-hidden="true"></canvas>
<div class="intro" id="intro"><div class="curtain l"></div><div class="curtain r"></div><h1 id="intro-t">Now showing</h1></div>

<header class="top">
  <a class="back" href="index.html#showroom">← Back to showroom</a>
  <nav class="nav-p" aria-label="Other projects"><a id="prev" aria-label="Previous project">‹</a><a id="next" aria-label="Next project">›</a></nav>
</header>

<main id="main">
  <div class="head">
    <div>
      <p class="mono kind" id="kind"></p>
      <h2 class="t" id="title"></h2>
      <span class="award" id="award"></span>
      <p class="pitch" id="pitch"></p>
    </div>
    <div class="acts">
      <a class="btn p" id="open" target="_blank" rel="noopener">Open full demo ↗</a>
      <a class="btn" id="src" target="_blank" rel="noopener">Source code ↗</a>
      <button class="btn" id="fs" type="button">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="theatre"><div class="screen" id="screen">
    <div class="chrome"><i></i><i></i><i></i><span id="url"></span><span class="rec mono">● Live</span></div>
  </div><div class="glow-floor"></div></div>

  <h3 class="sec-t">How I built it — <em>step by step</em></h3>
  <div class="steps" id="steps"></div>

  <h3 class="sec-t">Skills I <em>used here</em></h3>
  <div class="stack" id="stack"></div>

  <div class="more"><h3 class="sec-t">Next <em>room</em></h3><div class="others" id="others"></div></div>
</main>
<footer class="mono">© Khuwaish Goyal · <a href="index.html">Portfolio</a> · <a href="https://github.com/KhuwaishGoyal28" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/khuwaishgoyal" target="_blank" rel="noopener">LinkedIn</a></footer>

<script src="data.js"></script>
<script src="themes.js"></script>
<script>
(() => {
  const { SKILLS, PROJECTS, icon } = KG, $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('p');
  const i = Math.max(0, PROJECTS.findIndex(p => p.id === id)), P = PROJECTS[i];
  document.title = P.title + ' — Khuwaish Goyal';
  const T = (window.KG_THEMES && KG_THEMES[P.id]) || { mode: 'dark', bg: '#07080d', bg2: '#11141d', card: 'rgba(17,20,29,.8)', ink: '#ece9e1', mute: '#b4b9c9', accent: P.accent, accent2: '#5eead4', fx: 'nodes', curtain: ['#3a0b12', '#52121c'] };
  const R = document.documentElement.style, lum = hex => { const n = parseInt(hex.slice(1), 16); return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) / 255; };
  const vars = { '--bg': T.bg, '--bg2': T.bg2, '--card': T.card, '--ink': T.ink, '--mute': T.mute, '--accent': T.accent, '--accent2': T.accent2,
    '--line': T.mode === 'light' ? 'rgba(20,20,40,.12)' : 'rgba(255,255,255,.1)', '--cur1': T.curtain[0], '--cur2': T.curtain[1], '--onaccent': lum(T.accent) > .6 ? '#141005' : '#ffffff' };
  Object.entries(vars).forEach(([k, v]) => R.setProperty(k, v));
  document.documentElement.style.colorScheme = T.mode;
  document.body.classList.toggle('light', T.mode === 'light');
  document.querySelector('meta[name=theme-color]').content = T.bg;
  $('intro-t').textContent = P.title;
  $('kind').textContent = P.kind; $('title').textContent = P.title; $('award').textContent = P.award; $('award').insertAdjacentHTML('afterend', '<span class="theme-chip" aria-hidden="true"><i></i><i></i></span>'); $('pitch').textContent = P.pitch;
  const open = $('open'); if (P.demo) open.href = P.demo; else open.remove();
  $('src').href = P.src;
  $('url').textContent = P.demo || P.src;
  const scr = $('screen');
  if (P.demo) {
    const f = document.createElement('iframe');
    f.className = 'frame'; f.title = P.title + ' live demo'; f.src = P.demo;
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads');
    f.allow = 'microphone; camera; fullscreen';
    const w = document.createElement('div'); w.className = 'frame'; w.style.inset = '34px 0 0'; f.style.position = 'absolute'; f.style.inset = '0';
    w.appendChild(f); scr.appendChild(w);
  } else {
    scr.insertAdjacentHTML('beforeend', `<div class="nodemo"><div><h3>${P.title}</h3><p>This project runs locally with a trained model / desktop tool, so there is no live web demo. Explore the full code and notebooks on GitHub.</p><a class="btn p" href="${P.src}" target="_blank" rel="noopener">View on GitHub ↗</a></div></div>`);
    $('fs').remove();
  }
  $('fs') && $('fs').addEventListener('click', () => (scr.requestFullscreen || scr.webkitRequestFullscreen).call(scr));
  $('steps').innerHTML = P.steps.map((s, k) => `<div class="step" style="transition-delay:${k * .12}s"><b class="n">0${k + 1}</b><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('');
  $('stack').innerHTML = P.stack.map((k, n) => `<div class="sk" style="transition-delay:${n * .1}s">${icon(k)}<div><h5>${SKILLS[k].name}</h5><p>${SKILLS[k].how}</p></div></div>`).join('');
  const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length], next = PROJECTS[(i + 1) % PROJECTS.length];
  $('prev').href = 'project.html?p=' + prev.id; $('next').href = 'project.html?p=' + next.id;
  $('others').innerHTML = PROJECTS.filter(p => p !== P).map(p => `<a href="project.html?p=${p.id}" style="--accent:${p.accent}">${p.title}</a>`).join('');

  requestAnimationFrame(() => { $('intro').classList.add('open'); document.body.classList.add('ready'); });
  setTimeout(() => $('intro').remove(), 3200);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.step,.sk').forEach(el => io.observe(el));

  window.KG_FX && KG_FX($('warp'), T);
})();
</script>
</body>
</html>
